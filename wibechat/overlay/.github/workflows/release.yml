# Publishes the SDK to Maven Central when a version tag is pushed.
# sync.sh pushes vX.Y.Z tags for new upstream releases; push vX.Y.Z-wc.N by hand
# to release WibeChat-only changes on top of the same upstream version.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Resolve version
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          base="$(awk -F= '$1 == "VERSION_NAME" { print $2 }' gradle.properties)"
          case "$version" in
            "$base"|"$base"-*) ;;
            *) echo "::error::Tag $GITHUB_REF_NAME does not match VERSION_NAME=$base"; exit 1 ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: >
          ./gradlew
          wibechat-android-sdk:assembleRelease
          wibechat-android-camerax:assembleRelease
          wibechat-android-track-processors:assembleRelease
          wibechat-android-test:testReleaseUnitTest
          -PVERSION_NAME=${{ steps.version.outputs.version }}

      - name: Import signing key
        run: echo "$SIGNING_KEY_ARMOR" | base64 --decode | gpg --dearmor > "$RUNNER_TEMP/release.gpg"
        env:
          SIGNING_KEY_ARMOR: ${{ secrets.SIGNING_KEY_ARMOR }}

      - name: Publish to Maven Central
        run: >
          ./gradlew
          publishReleasePublicationToMavenRepository
          closeAndReleaseMavenStagingRepository
          --no-configuration-cache
          -Dorg.gradle.parallel=false
          -PVERSION_NAME=${{ steps.version.outputs.version }}
          -PnexusUsername="$CENTRAL_USERNAME"
          -PnexusPassword="$CENTRAL_PASSWORD"
          -PSTAGING_PROFILE_ID="$STAGING_PROFILE_ID"
          -Psigning.keyId="$SIGNING_KEY_ID"
          -Psigning.password="$SIGNING_KEY_PASSWORD"
          -Psigning.secretKeyRingFile="$RUNNER_TEMP/release.gpg"
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          STAGING_PROFILE_ID: ${{ secrets.STAGING_PROFILE_ID }}
          SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}

      - name: Create GitHub release
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
