# Rebrand configuration, read by sync.sh (sourced) and rebrand.py (KEY=VALUE).
# Keep values on one line, double-quoted, without shell expansions.

# Upstream SDK that main tracks.
UPSTREAM_URL="https://github.com/livekit/client-sdk-android.git"
UPSTREAM_BRANCH="main"

# Repo holding the .proto files referenced by the protocol submodule.
PROTOCOL_URL="https://github.com/livekit/protocol.git"

# Branches in origin.
MAIN_BRANCH="main"
REBRAND_BRANCH="wibechat-rebrand"

# Brand names. Each casing of the upstream name maps to the matching one here.
BRAND_PASCAL="WibeChat"
BRAND_CAPITALIZED="Wibechat"
BRAND_CAMEL="wibeChat"
BRAND_LOWER="wibechat"
BRAND_UPPER="WIBECHAT"
# Replaces the two-letter "LK" class prefix (LKLog -> WCLog).
BRAND_PREFIX="WC"

# Link targets for rewritten upstream URLs.
REPO_URL="https://github.com/anshif-zartek/wibechat-sdk-android"
GITHUB_ORG_URL="https://github.com/anshif-zartek"
DOCS_URL="https://docs.wibechat.io"
WEBSITE_URL="https://wibechat.io"
