syntax = "proto3";

package rpc;

option go_package = "github.com/anshif-zartek/protocol/rpc";

import "options.proto";
import "wibechat_models.proto";
import "wibechat_room.proto";

service Participant {
  rpc RemoveParticipant(wibechat.RoomParticipantIdentity) returns (wibechat.RemoveParticipantResponse) {
    option (psrpc.options) = {
      topics: true
      topic_params: {
        group: "participant"
        names: ["participant"]
        typed: true
      };
    };
  };
  rpc MutePublishedTrack(wibechat.MuteRoomTrackRequest) returns (wibechat.MuteRoomTrackResponse) {
    option (psrpc.options) = {
      topics: true
      topic_params: {
        group: "participant"
        names: ["participant"]
        typed: true
      };
    };
  };
  rpc UpdateParticipant(wibechat.UpdateParticipantRequest) returns (wibechat.ParticipantInfo) {
    option (psrpc.options) = {
      topics: true
      topic_params: {
        group: "participant"
        names: ["participant"]
        typed: true
      };
    };
  };
  rpc UpdateSubscriptions(wibechat.UpdateSubscriptionsRequest) returns (wibechat.UpdateSubscriptionsResponse) {
    option (psrpc.options) = {
      topics: true
      topic_params: {
        group: "participant"
        names: ["participant"]
        typed: true
      };
    };
  };
  rpc ForwardParticipant(wibechat.ForwardParticipantRequest) returns (wibechat.ForwardParticipantResponse) {
    option (psrpc.options) = {
      topics: true
      topic_params: {
        group: "participant"
        names: ["participant"]
        typed: true
      };
    };
  };
  rpc MoveParticipant(wibechat.MoveParticipantRequest) returns (wibechat.MoveParticipantResponse) {
    option (psrpc.options) = {
      topics: true
      topic_params: {
        group: "participant"
        names: ["participant"]
        typed: true
      };
    };
  };
  rpc PerformRpc(wibechat.PerformRpcRequest) returns (wibechat.PerformRpcResponse) {
    option (psrpc.options) = {
      topics: true
      topic_params : {
        group: "participant"
        names: ["participant"]
        typed: true
      };
    };
  };
}
