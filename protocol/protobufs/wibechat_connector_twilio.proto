syntax = "proto3";

package wibechat;
option go_package = "github.com/anshif-zartek/protocol/wibechat";
option csharp_namespace = "WibeChat.Proto";
option ruby_package = "WibeChat::Proto";

import "wibechat_agent_dispatch.proto";
import "logger/options.proto";

message ConnectTwilioCallRequest {

  enum TwilioCallDirection {
    // Call is inbound to WibeChat from Twilio
    TWILIO_CALL_DIRECTION_INBOUND = 0;
    // Call is outbound from WibeChat to Twilio
    TWILIO_CALL_DIRECTION_OUTBOUND = 1;
  }

  // The Direction of the call
  TwilioCallDirection twilio_call_direction = 1;
  // What WibeChat room should this call be connected to
  string room_name = 2;
  // Optional agents to dispatch the call to
  repeated RoomAgentDispatch agents = 3;
  // Optional identity of the participant in WibeChat room
  // This is used for logging purposes, so it is advised to not put PII in this field.
  string participant_identity= 4;
  // Optional name of the participant in WibeChat room
  string participant_name = 5 [
    (logger.sensitivity) = SENSITIVITY_PII,
    (logger.redact_format) = "<redacted ({{ .Size }} bytes)>"
  ];
  // Optional user-defined metadata. Will be attached to a created Participant in the room.
  string participant_metadata = 6 [
    (logger.sensitivity) = SENSITIVITY_PII,
    (logger.redact_format) = "<redacted ({{ .Size }} bytes)>"
  ];
  // Optional user-defined attributes. Will be attached to a created Participant in the room.
  map<string, string> participant_attributes = 7 [
    (logger.sensitivity) = SENSITIVITY_PII,
    (logger.redact_format) = "<redacted ({{ .Size }} bytes)>"
  ];
  // Country where the call terminates as ISO 3166-1 alpha-2 (https://en.wikipedia.org/wiki/ISO_3166-1_alpha-2). This will be used by the wibechat infrastructure to route calls.
  string destination_country = 8;
}

message ConnectTwilioCallResponse {
  // The websocket URL which twilio media stream will connect to
  string connect_url = 1;
}
